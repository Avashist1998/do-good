services:
  ui:
    build:
      context: ./ui
      dockerfile: dev.Dockerfile
    command: npm run dev
    ports:
      - "8090:9000"
    expose:
      - "9000"
    develop:
      watch:
        - action: sync
          path: ./ui/src
          target: /app/src
        - action: rebuild
          path: ./ui/package.json
          target: /app/package.json
    volumes:
      - /home/avashist/do-good/ui/src:/app/src
      # - ./ui/node_modules:/app/node_modules
    restart: always

  pb:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    ports:
      - "3010:3000"
    expose:
      - "3000"
    volumes:
      - ./pocketbase/data:/pb/pb_data
    restart: always